name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promptvault_test
          POSTGRES_USER: promptvault
          POSTGRES_PASSWORD: promptvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptvault -d promptvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://promptvault:promptvault@localhost:5432/promptvault_test
      TEST_DATABASE_URL: postgresql://promptvault:promptvault@localhost:5432/promptvault_test
      SECRET_KEY: ci-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.lock
      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.lock
      - name: Lint
        run: ruff check api scripts tests
      - name: Type-check
        run: mypy --config-file api/pyproject.toml api/app
      - name: Test with coverage
        run: pytest -q --cov=api.app --cov-config=api/pyproject.toml
      - name: Compile Python sources
        run: python -m compileall -q api/app api/tests scripts tests
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify OpenAPI export
        run: |
          python scripts/export-openapi.py --output /tmp/promptvault-openapi.json
