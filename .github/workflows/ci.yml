name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://promptvault:promptvault@localhost:5432/promptvault_test
      SECRET_KEY: ci-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Lint
        run: ruff check api scripts
      - name: Type-check
        run: mypy --config-file api/pyproject.toml api/app
      - name: Test with coverage
        run: pytest -q --cov=api.app --cov-config=api/pyproject.toml
      - name: Compile Python sources
        run: python -m compileall -q api/app api/tests scripts
      - name: Verify generated OpenAPI contract
        run: |
          python scripts/export-openapi.py --output /tmp/promptvault-openapi.json
          diff -u docs/openapi.json /tmp/promptvault-openapi.json
