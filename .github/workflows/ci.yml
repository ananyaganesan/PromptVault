name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: promptvault_test
          POSTGRES_USER: promptvault
          POSTGRES_PASSWORD: promptvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptvault -d promptvault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://promptvault:promptvault@localhost:5432/promptvault_test
      TEST_DATABASE_URL: postgresql://promptvault:promptvault@localhost:5432/promptvault_test
      SECRET_KEY: ci-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements-dev.lock
      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.lock
      - name: Lint
        run: ruff check api scripts tests
      - name: Type-check
        run: mypy --config-file api/pyproject.toml api/app
      - name: Test with coverage
        run: pytest -q --cov=api.app --cov-config=api/pyproject.toml
      - name: Compile Python sources
        run: python -m compileall -q api/app api/tests scripts tests
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify generated OpenAPI contract
        run: |
          python scripts/export-openapi.py --output /tmp/promptvault-openapi.json
          diff -u docs/openapi.json /tmp/promptvault-openapi.json

  docker-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: promptvault-ci
      POSTGRES_PORT: "55439"
      ENVIRONMENT: development
      SECRET_KEY: isolated-ci-secret-at-least-32-characters
      PROVIDER_ENCRYPTION_KEY: isolated-ci-provider-encryption-key
      SMTP_HOST: ""
      SMTP_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - name: Build application and verification images
        run: docker compose --profile verification build api web verify
      - name: Start isolated application stack
        run: docker compose up -d --wait api web
      - name: Verify container dependencies, migrations, API and SQL contracts
        run: docker compose --profile verification run --rm verify
      - name: Check local HTTP endpoints
        run: |
          curl --fail http://localhost:8000/ready
          curl --fail --output /dev/null http://localhost:5173/login
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=100 api migrate db web
      - name: Remove isolated CI resources
        if: always()
        run: docker compose --profile verification down -v
