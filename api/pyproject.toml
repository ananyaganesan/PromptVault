[project]
name = "promptvault-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
testpaths = ["tests"]
markers = ["database: requires TEST_DATABASE_URL and a running PostgreSQL server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ".."

[tool.coverage.run]
branch = true
source = ["api.app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
