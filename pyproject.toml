[project]
name = "promptvault"
version = "0.1.0"
description = "Prompt versioning and deployment platform"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23,<26",
    "certifi>=2026.7.22",
    "cryptography>=43,<51",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "PyJWT>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1,<2",
    "redis>=8,<9",
    "SQLAlchemy[asyncio]>=2.0,<2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.setuptools.package-data]
"api.app" = ["templates/*.html", "templates/assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["api/tests", "tests"]
markers = ["database: requires TEST_DATABASE_URL and a running PostgreSQL server"]
