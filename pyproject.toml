[project]
name = "promptvault"
version = "0.1.0"
description = "Prompt versioning and deployment platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["api/tests", "tests"]
markers = ["database: requires TEST_DATABASE_URL and a running PostgreSQL server"]
